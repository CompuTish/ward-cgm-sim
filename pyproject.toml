[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ward-cgm-sim"
version = "0.1.0"
description = "Academic POMDP ward simulator for inpatient CGM telemetry workflow research (MRes project). Not clinical decision support."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.4",
]

[project.optional-dependencies]
train = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "stable-baselines3>=2.0",
]
web = [
    "pygbag==0.9.3",
]
dev = [
    "pytest>=8.0",
    "gymnasium>=0.29",
    "numpy>=1.24",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["ward_cgm_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
